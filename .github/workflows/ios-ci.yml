name: iOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: iOS KMP framework build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build iOS simulator frameworks
        run: ./gradlew \
          :domain:linkDebugFrameworkIosSimulatorArm64 \
          :data:linkDebugFrameworkIosSimulatorArm64 \
          :presentation:linkDebugFrameworkIosSimulatorArm64 \
          :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Archive generated iOS framework outputs
        uses: actions/upload-artifact@v4
        with:
          name: checkincmp-ios-frameworks
          path: |
            domain/build/bin/iosSimulatorArm64/debugFramework/
            data/build/bin/iosSimulatorArm64/debugFramework/
            presentation/build/bin/iosSimulatorArm64/debugFramework/
            composeApp/build/bin/iosSimulatorArm64/debugFramework/
